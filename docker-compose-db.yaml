services:
  redis:
    image: redis:latest
    container_name: rust-api-redis

    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - yfs-network

    restart: always

  postgres:
    image: postgres:18
    container_name: rust-api-postgres

    environment:
      - POSTGRES_USER=my_user
      - POSTGRES_PASSWORD=Password
      - POSTGRES_DB=yfs

    volumes:
      - /data/yfs/pgsql:/var/lib/postgresql

    networks:
      - yfs-network

    ports:
      - 5432:5432
    restart: always


networks:
  yfs-network:
    external: true

# Do : docker network create yfs-network
